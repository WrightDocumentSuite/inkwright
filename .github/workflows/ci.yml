name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify SDK feature band
        shell: pwsh
        run: |
          $sdkVersion = (dotnet --version).Trim()
          if ($sdkVersion -notmatch '^10\.0\.4[0-9]{2}$') {
            throw "Expected a .NET 10.0.4xx SDK, selected $sdkVersion."
          }

      - name: Restore
        run: dotnet restore Inkwright.slnx --locked-mode

      - name: Build
        run: dotnet build Inkwright.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test public suite
        run: dotnet test Inkwright.slnx --configuration Release --no-build --no-restore

      - name: Audit vulnerable and deprecated packages
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./.github/scripts/Test-PackageHealth.ps1 -Solution Inkwright.slnx

  independent-conformance:
    name: Independent PDF/A and PDF/UA validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install an embeddable font
        run: sudo apt-get install --yes --no-install-recommends fonts-dejavu-core

      - name: Write one sample per conformance claim
        run: dotnet run --project .github/verapdf-samples/VeraPdfSamples.csproj --configuration Release -- artifacts/verapdf/samples

      - name: Check the independent validator gate
        shell: pwsh
        run: ./.github/scripts/Test-VeraPdfGate.ps1

      - name: Validate the samples with veraPDF
        shell: pwsh
        run: >-
          ./.github/scripts/Test-VeraPdf.ps1
          -SamplesDirectory artifacts/verapdf/samples
          -WorkDirectory "${{ runner.temp }}/verapdf"
          -InstallerSha256 b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59

      - name: Upload independent validation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verapdf-conformance
          path: |
            artifacts/verapdf/samples/*.pdf
            ${{ runner.temp }}/verapdf/reports/*.xml
          if-no-files-found: error
          retention-days: 14

  fuzz-seed-replay:
    name: Replay fuzz regression seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore fuzz harness
        run: dotnet restore fuzz/Inkwright.Fuzz/Inkwright.Fuzz.csproj --locked-mode

      - name: Build fuzz harness
        run: dotnet build fuzz/Inkwright.Fuzz/Inkwright.Fuzz.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Replay committed seeds
        shell: pwsh
        run: ./.github/scripts/Replay-FuzzSeeds.ps1
