name: Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip
  PACKAGE_VALIDATION_BASELINE: 0.1.4

jobs:
  validate-packages:
    name: Pack, Source Link, and Native AOT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify SDK feature band
        shell: pwsh
        run: |
          $sdkVersion = (dotnet --version).Trim()
          if ($sdkVersion -notmatch '^10\.0\.4[0-9]{2}$') {
            throw "Expected a .NET 10.0.4xx SDK, selected $sdkVersion."
          }

      - name: Select an unpublished CI package version
        shell: pwsh
        run: |
          $baseVersion = (dotnet msbuild src/Inkwright/Inkwright.csproj -getProperty:Version -nologo | Select-Object -Last 1).Trim()
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable three-part base version, found '$baseVersion'."
          }
          $ciVersion = "$baseVersion-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          "PACKAGE_VERSION=$ciVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packing $ciVersion against baseline $env:PACKAGE_VALIDATION_BASELINE."

      - name: Restore package-validation baseline
        shell: pwsh
        run: |
          dotnet restore Inkwright.slnx --locked-mode `
            "-p:Version=$env:PACKAGE_VERSION" `
            -p:EnablePackageValidation=true `
            "-p:PackageValidationBaselineVersion=$env:PACKAGE_VALIDATION_BASELINE"
          if ($LASTEXITCODE -ne 0) { throw "Restore failed with exit code $LASTEXITCODE." }

      - name: Pack and validate public API compatibility
        shell: pwsh
        run: |
          dotnet pack Inkwright.slnx `
            --configuration Release `
            --no-restore `
            --output artifacts/packages `
            "-p:Version=$env:PACKAGE_VERSION" `
            -p:ContinuousIntegrationBuild=true `
            -p:EnablePackageValidation=true `
            "-p:PackageValidationBaselineVersion=$env:PACKAGE_VALIDATION_BASELINE"
          if ($LASTEXITCODE -ne 0) { throw "Pack failed with exit code $LASTEXITCODE." }

      - name: Inspect package contents and provenance
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          ./.github/scripts/Test-Packages.ps1 `
            -PackageDirectory artifacts/packages `
            -Version $env:PACKAGE_VERSION `
            -RepositoryCommit $commit

      - name: Validate Source Link
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'sourcelink'
          dotnet tool install sourcelink --version 3.1.1 --tool-path $toolDirectory
          if ($LASTEXITCODE -ne 0) { throw "Source Link tool installation failed with exit code $LASTEXITCODE." }

          $sourceLink = Join-Path $toolDirectory 'sourcelink'
          ./.github/scripts/Test-SourceLink.ps1 `
            -PackageDirectory artifacts/packages `
            -SourceLinkTool $sourceLink `
            -RepositoryCommit (git rev-parse HEAD).Trim()

      - name: Publish and run external Native AOT consumer
        shell: pwsh
        run: |
          ./.github/scripts/Run-PackageAotSmoke.ps1 `
            -PackageDirectory artifacts/packages `
            -PackageVersion $env:PACKAGE_VERSION `
            -RuntimeIdentifier linux-x64 `
            -WorkingDirectory $env:RUNNER_TEMP

      - name: Upload validated packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkwright-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
